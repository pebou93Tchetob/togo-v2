<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Togo Go V6.6.8 Belle</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#f8fafc}</style>
</head>
<body class="pb-20">
<header class="bg-gradient-to-r from-green-600 to-yellow-500 text-white p-3 sticky top-0 z-50 flex justify-between items-center">
<b class="text-sm">Togo Go 🇹🇬</b>
<div class="flex gap-2">
<button onclick="document.getElementById('menuCompte').classList.toggle('hidden')" class="bg-white text-green-700 px-4 py-2 rounded-full text-xs font-black">👤 Compte ▼</button>
<button onclick="location.reload()" class="bg-black/20 px-3 py-2 rounded-full text-xs">↻</button>
</div>
</header>

<div id="menuCompte" class="hidden fixed top-14 right-3 bg-white shadow-2xl rounded-2xl p-3 z-50 w-60 border">
<p class="font-bold text-xs mb-2">Choisir profil:</p>
<button onclick="show('vendeur');hideMenu()" class="w-full text-left p-3 hover:bg-green-50 rounded-xl text-sm">🏪 Vendeur LIBRE + LIVE 📸</button>
<button onclick="show('client');hideMenu()" class="w-full text-left p-3 hover:bg-blue-50 rounded-xl text-sm">👤 Client - Mes Infos</button>
<button onclick="show('livreur');hideMenu()" class="w-full text-left p-3 hover:bg-orange-50 rounded-xl text-sm">🛵 Livreur Vérifié</button>
<button onclick="show('home');hideMenu()" class="w-full text-left p-3 hover:bg-gray-50 rounded-xl text-sm mt-2 border-t">🏠 Accueil Photos</button>
</div>

<!-- ACCUEIL PHOTOS JOLI COMME AVANT -->
<div id="home" class="p-3 max-w-4xl mx-auto">
<div class="bg-white p-3 rounded-2xl shadow flex gap-2"><input id="q" oninput="render()" placeholder="Chercher..." class="flex-1 outline-none text-sm"><span>🔍</span></div>

<div id="liveHome" class="hidden mt-3 bg-black rounded-2xl overflow-hidden border-2 border-red-600"><div class="bg-red-600 text-white p-2 text-xs flex justify-between"><span>🔴 LIVE</span><button onclick="stopL()" class="bg-white text-red-600 px-3 rounded-full">X</button></div><video id="vHome" autoplay muted playsinline class="w-full h-64"></video></div>

<div id="grid" class="grid grid-cols-2 gap-3 mt-4"></div>
</div>

<!-- VENDEUR -->
<div id="vendeur" class="hidden p-3 max-w-4xl mx-auto">
<div class="bg-white p-5 rounded-2xl shadow">
<div class="flex justify-between"><h2 class="font-black">🏪 Vendeur LIBRE</h2><button onclick="show('home')" class="bg-gray-100 px-3 py-1 rounded-full text-xs">⬅️ Accueil</button></div>
<div id="zoneLive" class="hidden mt-3 bg-black rounded-2xl overflow-hidden border-2 border-red-600"><video id="vLive" autoplay muted playsinline class="w-full h-72"></video><button onclick="stopL()" class="w-full bg-red-600 text-white p-2 text-xs">Couper LIVE</button></div>
<button onclick="startL()" id="bStart" class="mt-3 w-full bg-red-600 text-white py-3 rounded-xl font-bold text-xs">📸 LANCER LIVE</button>
<input id="vNom" placeholder="Nom boutique" class="mt-4 w-full border-2 rounded-xl p-3 text-sm"><input id="vQuoi" placeholder="Tu vends quoi? Écris libre..." class="w-full border-2 border-green-500 rounded-xl p-3 text-sm mt-2">
<input id="pNom" placeholder="Nom produit" class="w-full border rounded-xl p-3 text-sm mt-3"><input id="pPrix" type="number" placeholder="Prix" class="w-full border rounded-xl p-3 text-sm mt-2">
<input type="file" id="pImg" accept="image/*" class="mt-2 w-full text-xs">
<button onclick="pub()" class="mt-3 w-full bg-black text-white p-3 rounded-xl font-bold">✅ Publier avec Photo</button>
</div>
<div id="my" class="grid grid-cols-2 gap-3 mt-4"></div>
</div>

<!-- CLIENT AVEC INFOS RESTAURÉ -->
<div id="client" class="hidden p-3 max-w-4xl mx-auto">
<div class="bg-white p-5 rounded-2xl shadow border-t-4 border-blue-500">
<div class="flex justify-between"><h2 class="font-black">👤 Client - Mes Informations</h2><button onclick="show('home')" class="bg-gray-100 px-3 py-1 rounded-full text-xs">⬅️ Accueil</button></div>
<p class="text-[11px] text-gray-500 mt-2">Comme avant Djo, tu peux mettre tes infos</p>
<div class="mt-4 space-y-2">
<input id="cNom" placeholder="Nom complet" class="w-full border-2 rounded-xl p-3 text-sm">
<input id="cTel" placeholder="Numéro WhatsApp" class="w-full border-2 rounded-xl p-3 text-sm">
<input id="cAddr" placeholder="Adresse: Adidogomé, Agoè..." class="w-full border-2 rounded-xl p-3 text-sm">
<textarea id="cNote" placeholder="Note pour livreur..." class="w-full border-2 rounded-xl p-3 text-sm h-20"></textarea>
<button onclick="saveClient()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-sm">💾 Enregistrer Mes Infos</button>
</div>
<div id="clientSaved" class="mt-4 hidden bg-blue-50 p-3 rounded-xl text-xs"></div>
</div>
</div>

<!-- LIVREUR CORRIGE MAIS JOLI -->
<div id="livreur" class="hidden p-3 max-w-4xl mx-auto">
<div class="bg-white p-5 rounded-2xl shadow border-t-4 border-orange-500">
<div class="flex justify-between"><h2 class="font-black text-sm">🛵 Livreur Vérifié</h2><button onclick="show('home')" class="bg-gray-100 px-3 py-1 rounded-full text-xs">⬅️ Accueil</button></div>
<input id="lNom" placeholder="Nom" class="mt-3 w-full border-2 rounded-xl p-3 text-sm"><input id="lTel" placeholder="Tel" class="mt-2 w-full border-2 rounded-xl p-3 text-sm"><input id="lCNI" placeholder="N° CNI" class="mt-2 w-full border-2 rounded-xl p-3 text-sm">
<div class="grid grid-cols-2 gap-2 mt-3"><label class="border-2 border-dashed p-3 rounded-xl text-xs text-center">+ CNI Recto<input type="file" class="hidden" accept="image/*" onchange="prev(this,'R')"><img id="imgR" class="hidden h-16 w-full object-cover mt-1 rounded"></label><label class="border-2 border-dashed p-3 rounded-xl text-xs text-center">+ CNI Verso<input type="file" class="hidden" accept="image/*" onchange="prev(this,'V')"><img id="imgV" class="hidden h-16 w-full object-cover mt-1 rounded"></label></div>
<div class="mt-3 bg-blue-50 p-3 rounded-xl"><p class="text-xs font-bold">🤳 Selfie</p><video id="vSelfie" autoplay muted playsinline class="hidden w-full h-40 bg-black rounded-xl mt-2"></video><img id="imgSelfie" class="hidden w-full h-40 object-cover rounded-xl mt-2"><div class="flex gap-2 mt-2"><button onclick="startSelfie()" id="bS1" class="flex-1 bg-blue-600 text-white py-2 rounded-xl text-xs">Ouvrir Caméra</button><button onclick="takeSelfie()" id="bS2" class="hidden flex-1 bg-green-600 text-white py-2 rounded-xl text-xs">Prendre</button></div></div>
<div class="mt-3 bg-green-50 p-3 rounded-xl"><p id="txtGps" class="text-xs">📍 GPS non pris</p><button onclick="getGPS()" class="mt-2 w-full bg-green-600 text-white py-2 rounded-xl text-xs">📡 Prendre GPS</button></div>
<div class="mt-3 flex gap-2 items-center bg-black text-white p-3 rounded-xl text-xs"><input type="checkbox" id="lTracking" checked> Tracking LIVE ON</div>
<button onclick="validerLivreur()" class="mt-4 w-full bg-orange-600 text-white py-4 rounded-xl font-black">✅ VALIDER</button>
</div>
</div>

<script>
let LIVE=null, face='user', streamSelfie=null, dataSelfie=null, posGps=null, dataR=null, dataV=null, tempImg=null;
const BASE=[
{n:"Tomates",p:800,img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=300"},
{n:"Wax",p:12000,img:"https://images.unsplash.com/photo-1520903923805-20d4f2c4c4d8?w=300"},
{n:"Riz",p:2500,img:"https://images.unsplash.com/photo-1536304929831-ee1ca9d44906?w=300"},
{n:"Chaussures",p:18000,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300"},
{n:"Bananes",p:500,img:"https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=300"},
{n:"Ciment",p:8500,img:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=300"},
{n:"Médic",p:1500,img:"https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=300"},
{n:"Chambre",p:15000,img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=300"}
];
function hideMenu(){document.getElementById('menuCompte').classList.add('hidden')}
function show(id){['home','vendeur','client','livreur'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));hideMenu();if(id==='home')render();if(id==='client')loadClient();}
function render(){
 let q=(document.getElementById('q').value||'').toLowerCase();
 let all=[...JSON.parse(localStorage.getItem('tg')||'[]'),...BASE].filter(x=>!q||x.n.toLowerCase().includes(q));
 document.getElementById('grid').innerHTML=all.map(x=>`<div class="bg-white rounded-2xl shadow overflow-hidden"><img src="${x.img||'https://via.placeholder.com/300'}" class="w-full h-32 object-cover"><div class="p-2"><p class="font-bold text-xs">${x.n}</p><p class="text-green-600 font-black text-xs">${x.p} F</p></div></div>`).join('');
 let my=JSON.parse(localStorage.getItem('tg')||'[]');
 document.getElementById('my').innerHTML=my.map(x=>`<div class="bg-white rounded-2xl shadow overflow-hidden"><img src="${x.img}" class="w-full h-24 object-cover"><div class="p-2"><p class="text-xs font-bold">${x.n}</p><p class="text-[10px] text-green-600">${x.p}F</p></div></div>`).join('');
}
document.getElementById('pImg').addEventListener('change',e=>{let r=new FileReader();r.onload=v=>tempImg=v.target.result;r.readAsDataURL(e.target.files[0])});
function pub(){let n=document.getElementById('pNom').value,pr=parseInt(document.getElementById('pPrix').value);if(!n||!pr)return alert('Nom+Prix');let a=JSON.parse(localStorage.getItem('tg')||'[]');a.unshift({n,p:pr,img:tempImg||'https://via.placeholder.com/300'});localStorage.setItem('tg',JSON.stringify(a));render();alert('Publié avec photo!');}
function saveClient(){let o={nom:document.getElementById('cNom').value,tel:document.getElementById('cTel').value,addr:document.getElementById('cAddr').value,note:document.getElementById('cNote').value};localStorage.setItem('clientInfo',JSON.stringify(o));document.getElementById('clientSaved').classList.remove('hidden');document.getElementById('clientSaved').innerHTML=`✅ Enregistré: ${o.nom} - ${o.tel} - ${o.addr}`;alert('Infos client enregistrées');}
function loadClient(){let o=JSON.parse(localStorage.getItem('clientInfo')||'null');if(o){document.getElementById('cNom').value=o.nom;document.getElementById('cTel').value=o.tel;document.getElementById('cAddr').value=o.addr;document.getElementById('cNote').value=o.note;document.getElementById('clientSaved').classList.remove('hidden');document.getElementById('clientSaved').innerHTML=`✅ ${o.nom} - ${o.tel}`;}}
async function startL(){try{if(LIVE)LIVE.getTracks().forEach(t=>t.stop());LIVE=await navigator.mediaDevices.getUserMedia({video:{facingMode:face},audio:true});document.getElementById('vLive').srcObject=LIVE;document.getElementById('vHome').srcObject=LIVE;document.getElementById('zoneLive').classList.remove('hidden');document.getElementById('liveHome').classList.remove('hidden');document.getElementById('bStart').classList.add('hidden');}catch(e){alert(e.message)}}
function stopL(){if(LIVE)LIVE.getTracks().forEach(t=>t.stop());document.getElementById('zoneLive').classList.add('hidden');document.getElementById('liveHome').classList.add('hidden');document.getElementById('bStart').classList.remove('hidden');}
function prev(inp,t){let r=new FileReader();r.onload=e=>{if(t==='R'){dataR=e.target.result;document.getElementById('imgR').src=dataR;document.getElementById('imgR').classList.remove('hidden')}else{dataV=e.target.result;document.getElementById('imgV').src=dataV;document.getElementById('imgV').classList.remove('hidden')}};r.readAsDataURL(inp.files[0])}
async function startSelfie(){streamSelfie=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});document.getElementById('vSelfie').srcObject=streamSelfie;document.getElementById('vSelfie').classList.remove('hidden');document.getElementById('bS1').classList.add('hidden');document.getElementById('bS2').classList.remove('hidden');}
function takeSelfie(){let v=document.getElementById('vSelfie'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);dataSelfie=c.toDataURL('image/jpeg');document.getElementById('imgSelfie').src=dataSelfie;document.getElementById('imgSelfie').classList.remove('hidden');v.classList.add('hidden');if(streamSelfie)streamSelfie.getTracks().forEach(t=>t.stop());}
function getGPS(){navigator.geolocation.getCurrentPosition(p=>{posGps={lat:p.coords.latitude,lng:p.coords.longitude};document.getElementById('txtGps').innerText=`✅ GPS: ${posGps.lat.toFixed(4)}, ${posGps.lng.toFixed(4)}`});}
function validerLivreur(){if(!dataR||!dataV||!dataSelfie||!posGps)return alert('CNI Recto+Verso + Selfie + GPS obligatoires');alert('✅ Livreur validé!');show('home');}
render();
</script>
</body>
</html>
