<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Togo Go - Marché 24/24</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:sans-serif;background:#f8fafc}</style>
</head>
<body class="pb-24">
<header class="bg-gradient-to-r from-green-600 to-yellow-500 text-white p-3 sticky top-0 z-50 shadow">
<div class="flex justify-between items-center max-w-7xl mx-auto">
<b class="text-[15px]"><i class="fa-solid fa-bag-shopping"></i> Togo Go</b>
<div class="flex gap-1">
<button onclick="showPage('home')" class="bg-white text-green-700 px-3 py-1.5 rounded-full text-[11px] font-bold">Accueil</button>
<button onclick="showPage('vendeurDash')" class="bg-black/20 px-3 py-1.5 rounded-full text-[11px] font-bold">🏪</button>
<button onclick="killGhost()" class="bg-red-600 px-2 py-1.5 rounded-full text-[9px] font-bold">🚨</button>
<button onclick="showPage('register')" class="bg-black/20 px-3 py-1.5 rounded-full text-[11px] font-bold">Compte</button>
</div>
</div>
</header>

<div id="homePage" class="max-w-7xl mx-auto p-3">
<div class="bg-white rounded-2xl p-3 shadow mt-2 flex gap-2"><input id="searchInput" oninput="render(getAll())" placeholder="Chercher produits..." class="flex-1 border rounded-xl px-3 py-3 text-sm"><button onclick="getGPS()" class="bg-blue-600 text-white px-3 rounded-xl text-[10px]">📍 GPS</button></div>
<div id="liveHomeZone" class="hidden mt-3 bg-black rounded-2xl overflow-hidden"><div class="bg-red-600 text-white p-2 flex justify-between text-xs"><b>🔴 LIVE EN DIRECT</b><button onclick="killGhost()" class="bg-white text-red-600 px-2 rounded-full text-[9px]">Fermer</button></div><video id="homeLiveVideo" autoplay muted playsinline class="w-full h-60 bg-black object-cover"></video></div>
<div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3"></div>
</div>

<div id="vendeurDashPage" class="hidden max-w-4xl mx-auto p-4">
<div class="bg-white rounded-2xl shadow p-5 mt-3">
<h2 class="font-black">🏪 Mon Boutique</h2>
<div class="mt-4 bg-red-50 border-2 border-red-300 rounded-xl p-4">
<h3 class="font-bold text-sm text-red-700">🔴 LIVE Vidéo</h3>
<video id="liveVideo" autoplay muted playsinline class="hidden w-full h-64 bg-black rounded-xl mt-3 object-cover"></video>
<div class="flex gap-2 mt-3">
<button onclick="startLive()" id="btnStartLive" class="flex-1 bg-red-600 text-white py-3 rounded-xl text-sm font-black"><i class="fa-solid fa-video"></i> Démarrer LIVE Selfie</button>
<button onclick="switchCamera()" id="btnSwitch" class="hidden bg-blue-600 text-white px-4 py-3 rounded-xl">🔄</button>
<button onclick="stopLive()" id="btnStopLive" class="hidden bg-gray-800 text-white px-4 py-3 rounded-xl">⏹️ Couper</button>
</div>
<p id="liveStatus" class="hidden text-[11px] text-red-600 mt-2 text-center">🔴 En direct - <span id="camMode">Selfie</span></p>
</div>
<div class="mt-5 border-2 border-dashed rounded-xl p-4"><h3 class="font-bold text-sm">➕ Publier Produit</h3><input id="pName" placeholder="Nom" class="mt-2 w-full border rounded p-2 text-sm"><div class="grid grid-cols-2 gap-2 mt-2"><input id="pPriceDetail" type="number" placeholder="Prix Détail" class="border-2 border-green-200 rounded p-2 text-sm"><input id="pPriceGros" type="number" placeholder="Prix Gros" class="border-2 border-yellow-200 rounded p-2 text-sm"></div><input id="pPhoto" placeholder="Lien photo" class="mt-2 w-full border rounded p-2 text-sm"><button onclick="publishProduct()" class="mt-3 w-full bg-black text-white p-3 rounded-xl font-bold">Publier</button></div>
<div class="mt-4"><h3 class="font-bold text-sm">Mes produits <span id="myCount">0</span></h3><div id="myProducts" class="mt-2 grid grid-cols-2 gap-2"></div></div>
</div>
</div>

<div id="registerPage" class="hidden max-w-3xl mx-auto p-4">
<div class="bg-white rounded-2xl shadow p-6 mt-3">
<h2 class="text-xl font-black text-center">Compte</h2>
<p class="text-center text-[12px] text-gray-500 mt-1">Rejoins Togo Go</p>
<div class="grid grid-cols-3 gap-2 mt-5">
<button id="btnClient" onclick="setRole('client')" class="border-2 border-green-600 bg-green-50 p-3 rounded-xl font-bold text-xs">Client</button>
<button id="btnVendeur" onclick="setRole('vendeur')" class="border p-3 rounded-xl font-bold text-xs">Vendeur</button>
<button id="btnLivreur" onclick="setRole('livreur')" class="border p-3 rounded-xl font-bold text-xs">Livreur</button>
</div>
<div id="formClient" class="mt-5 space-y-3"><input id="cNom" placeholder="Ton nom" class="w-full border rounded-xl p-3 text-sm"><input id="cTel" placeholder="Téléphone" class="w-full border rounded-xl p-3 text-sm"><button onclick="registerClient()" class="w-full bg-green-600 text-white p-3 rounded-xl font-bold">Créer compte Client</button></div>
<div id="formVendeur" class="hidden mt-5 space-y-3"><input id="vNom" placeholder="Nom boutique" class="w-full border rounded-xl p-3 text-sm"><input id="vTel" placeholder="Téléphone" class="w-full border rounded-xl p-3 text-sm"><select id="vType" class="w-full border rounded-xl p-3 text-sm"><option value="">Type boutique</option><option value="hotel">🏨 Hôtel</option><option value="restaurant">🍚 Restaurant</option><option value="ambulant">🚶 Ambulant</option><option value="boutique">🏪 Boutique</option><option value="autre">📦 Autre</option></select><div class="bg-gray-50 border rounded-xl p-3 space-y-1"><label class="flex gap-2 text-xs p-2 bg-white rounded-lg border-2 border-green-500"><input type="radio" name="abo" value="1000" checked> 1000F - Ambulant</label><label class="flex gap-2 text-xs p-2 bg-white rounded-lg border"><input type="radio" name="abo" value="2000"> 2000F - PRO</label></div><button onclick="registerVendeur()" class="w-full bg-green-600 text-white p-3 rounded-xl font-bold">Créer compte Vendeur</button></div>
<div id="formLivreur" class="hidden mt-5 space-y-3"><input id="lNom" placeholder="Nom" class="w-full border rounded-xl p-3 text-sm"><input id="lTel" placeholder="Tel" class="w-full border rounded-xl p-3 text-sm"><input id="lCNI" placeholder="Numéro CNI" class="w-full border-2 border-red-200 rounded-xl p-3 text-sm"><div class="grid grid-cols-2 gap-2"><input id="lPlaque" placeholder="Plaque" class="border-2 border-red-200 rounded-xl p-3 text-sm"><input id="lMarque" placeholder="Marque moto" class="border rounded-xl p-3 text-sm"></div><button onclick="registerLivreur()" class="w-full bg-black text-white p-3 rounded-xl font-bold">Créer compte Livreur</button></div>
</div>
</div>

<script>
const BASE=[{id:1,name:"Tomates fraîches 1kg",price:800,priceGros:7000,vendeur:"Afi - Agoè",img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=300"},{id:2,name:"Pagne Wax",price:12000,priceGros:100000,vendeur:"Adawlato",img:"https://via.placeholder.com/300"}];
let liveStream=null,currentFacing='user',role='client';
function getAll(){return [...JSON.parse(localStorage.getItem('togo_vendeur_products')||'[]'),...BASE];}
function init(){render(getAll());}
function showPage(p){document.getElementById('homePage').classList.toggle('hidden',p!=='home');document.getElementById('vendeurDashPage').classList.toggle('hidden',p!=='vendeurDash');document.getElementById('registerPage').classList.toggle('hidden',p!=='register');}
function render(list){document.getElementById('productsGrid').innerHTML=list.map(pr=>`<div class="bg-white rounded-xl shadow p-2"><img src="${pr.img}" class="rounded-lg h-28 w-full object-cover"><h4 class="font-bold text-[12px] mt-1">${pr.name}</h4><p class="text-[10px] text-gray-500">${pr.vendeur}</p><p class="text-green-600 font-black text-xs">${pr.price}F ${pr.priceGros?` | Gros ${pr.priceGros}F`:''}</p><button class="mt-2 bg-green-600 text-white w-full py-2 rounded-lg text-[11px]">Commander</button></div>`).join('');}
function setRole(r){role=r;document.getElementById('btnClient').className=r==='client'?'border-2 border-green-600 bg-green-50 p-3 rounded-xl font-bold text-xs':'border p-3 rounded-xl font-bold text-xs';document.getElementById('btnVendeur').className=r==='vendeur'?'border-2 border-green-600 bg-green-50 p-3 rounded-xl font-bold text-xs':'border p-3 rounded-xl font-bold text-xs';document.getElementById('btnLivreur').className=r==='livreur'?'border-2 border-green-600 bg-green-50 p-3 rounded-xl font-bold text-xs':'border p-3 rounded-xl font-bold text-xs';document.getElementById('formClient').classList.toggle('hidden',r!=='client');document.getElementById('formVendeur').classList.toggle('hidden',r!=='vendeur');document.getElementById('formLivreur').classList.toggle('hidden',r!=='livreur');}
function registerClient(){const n=document.getElementById('cNom').value,t=document.getElementById('cTel').value;if(!n||!t)return alert('Remplis');localStorage.setItem('togo_user',JSON.stringify({role:'client',nom:n}));alert('Compte Client créé!');showPage('home');}
function registerVendeur(){const n=document.getElementById('vNom').value,t=document.getElementById('vTel').value,ty=document.getElementById('vType').value;if(!n||!t||!ty)return alert('Remplis');localStorage.setItem('togo_user',JSON.stringify({role:'vendeur',nom:n,type:ty}));alert('Compte Vendeur Togo Go créé!');showPage('vendeurDash');}
function registerLivreur(){const n=document.getElementById('lNom').value,t=document.getElementById('lTel').value;if(!n||!t)return alert('Remplis');localStorage.setItem('togo_user',JSON.stringify({role:'livreur',nom:n}));alert('Compte Livreur créé!');showPage('home');}
function killGhost(){if(liveStream){liveStream.getTracks().forEach(x=>x.stop());liveStream=null;}document.querySelectorAll('video').forEach(v=>{v.srcObject=null;v.classList.add('hidden');});localStorage.removeItem('togo_live_active');document.getElementById('liveHomeZone').classList.add('hidden');document.getElementById('btnStartLive').classList.remove('hidden');document.getElementById('btnStopLive').classList.add('hidden');document.getElementById('btnSwitch').classList.add('hidden');document.getElementById('liveStatus').classList.add('hidden');}
async function startLive(){try{if(liveStream)liveStream.getTracks().forEach(t=>t.stop());try{liveStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:currentFacing},audio:true});}catch{liveStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});}const v=document.getElementById('liveVideo'),hv=document.getElementById('homeLiveVideo');v.srcObject=liveStream;hv.srcObject=liveStream;v.classList.remove('hidden');document.getElementById('liveHomeZone').classList.remove('hidden');v.style.transform=currentFacing==='user'?'scaleX(-1)':'none';hv.style.transform=currentFacing==='user'?'scaleX(-1)':'none';document.getElementById('btnStartLive').classList.add('hidden');document.getElementById('btnStopLive').classList.remove('hidden');document.getElementById('btnSwitch').classList.remove('hidden');document.getElementById('liveStatus').classList.remove('hidden');localStorage.setItem('togo_live_active','1');}catch(e){alert('Autorise caméra: cadenas à côté adresse → Autoriser');}}
async function switchCamera(){currentFacing=currentFacing==='user'?'environment':'user';await startLive();document.getElementById('camMode').innerText=currentFacing==='user'?'Selfie':'Arrière';}
function stopLive(){killGhost();alert('LIVE coupé!');}
function publishProduct(){const n=document.getElementById('pName').value,pd=parseInt(document.getElementById('pPriceDetail').value),pg=parseInt(document.getElementById('pPriceGros').value)||0,ph=document.getElementById('pPhoto').value;if(!n||!pd)return alert('Nom + Détail');const all=JSON.parse(localStorage.getItem('togo_vendeur_products')||'[]');all.unshift({id:Date.now(),name:n,price:pd,priceGros:pg,img:ph||'https://via.placeholder.com/300',vendeur:'Ma boutique'});localStorage.setItem('togo_vendeur_products',JSON.stringify(all));render(getAll());alert('Publié sur Togo Go!');}
function getGPS(){}
window.addEventListener('load',init);
</script>
</body>
</html>
