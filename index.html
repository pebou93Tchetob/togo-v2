<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Togo Go 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 pb-20">
<header class="bg-green-600 text-white p-4 sticky top-0 z-50">
<div class="flex justify-between max-w-5xl mx-auto">
<b>🛍️ Togo Go GRATUIT</b>
<div class="flex gap-2">
<button onclick="go('home')" class="bg-white text-green-600 px-3 py-1 rounded-full text-xs font-bold">Accueil</button>
<button onclick="go('pub')" class="bg-black/20 px-3 py-1 rounded-full text-xs">🏪 Publier</button>
<button onclick="go('compte')" class="bg-black/20 px-3 py-1 rounded-full text-xs">Compte</button>
</div>
</div>
</header>

<div id="home" class="max-w-5xl mx-auto p-3">
<div class="bg-white p-3 rounded-xl shadow mt-2 text-center text-xs font-bold text-green-700">🎉 TOUT GRATUIT - Beta 2026 - Si tu vois ça, c'est le NOUVEAU CODE!</div>
<div id="grid" class="grid grid-cols-2 gap-3 mt-3"></div>
</div>

<div id="pub" class="hidden max-w-xl mx-auto p-4">
<div class="bg-white rounded-xl shadow p-4 mt-3">
<h2 class="font-black">🏪 Publier avec PHOTO - GRATUIT</h2>
<img id="prev" class="hidden w-full h-60 object-cover rounded-xl mt-3 border-4 border-green-500">
<input type="file" id="file" accept="image/*" class="mt-3 w-full text-xs">
<input id="nom" placeholder="Nom produit ex: Tomates 1kg" class="mt-3 w-full border rounded-xl p-3 text-sm">
<input id="prix" type="number" placeholder="Prix F CFA" class="mt-2 w-full border rounded-xl p-3 text-sm">
<textarea id="desc" placeholder="Description..." class="mt-2 w-full border rounded-xl p-3 text-sm"></textarea>
<button onclick="publier()" class="mt-3 w-full bg-green-600 text-white p-3 rounded-xl font-bold">✅ Publier GRATUIT</button>
<div id="my" class="grid grid-cols-2 gap-2 mt-4"></div>
</div>
</div>

<div id="compte" class="hidden max-w-xl mx-auto p-4">
<div class="bg-white rounded-xl shadow p-5 mt-3">
<h2 class="font-black text-center">Compte</h2>
<div class="grid grid-cols-3 gap-2 mt-4">
<button id="bC" onclick="role('client')" class="bg-green-600 text-white p-3 rounded-xl font-bold text-xs">Client</button>
<button id="bV" onclick="role('vendeur')" class="bg-gray-100 p-3 rounded-xl font-bold text-xs">Vendeur</button>
<button id="bL" onclick="role('livreur')" class="bg-gray-100 p-3 rounded-xl font-bold text-xs">Livreur</button>
</div>
<div id="fC" class="mt-4 space-y-2"><input id="cNom" placeholder="Nom" class="w-full border rounded-xl p-3 text-sm"><button onclick="creer('client')" class="w-full bg-green-600 text-white p-3 rounded-xl font-bold">Créer Client</button></div>
<div id="fV" class="hidden mt-4 space-y-2"><input id="vNom" placeholder="Nom boutique / Hôtel" class="w-full border rounded-xl p-3 text-sm"><select id="vType" class="w-full border rounded-xl p-3 text-sm bg-white"><option value="boutique">🏪 Boutique</option><option value="hotel">🏨 Hôtel</option><option value="restaurant">🍚 Restaurant</option><option value="autre">✍️ Autre libre</option></select><input id="vAutre" placeholder="Si Autre, écris ici" class="w-full border rounded-xl p-3 text-sm"><button onclick="creer('vendeur')" class="w-full bg-orange-600 text-white p-3 rounded-xl font-bold">Créer Boutique GRATUITE</button></div>
<div id="fL" class="hidden mt-4 space-y-2"><input id="lNom" placeholder="Nom livreur" class="w-full border rounded-xl p-3 text-sm"><button onclick="creer('livreur')" class="w-full bg-red-600 text-white p-3 rounded-xl font-bold">Créer Livreur</button></div>
</div>
</div>

<script>
let R='client', photo=null;
const BASE=[{name:"Tomates",price:800,vendeur:"Afi",img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400"}];
function getAll(){return [...JSON.parse(localStorage.getItem('tg')||'[]'),...BASE];}
function go(p){document.getElementById('home').classList.toggle('hidden',p!=='home');document.getElementById('pub').classList.toggle('hidden',p!=='pub');document.getElementById('compte').classList.toggle('hidden',p!=='compte');if(p==='pub')my();}
function role(r){R=r;document.getElementById('bC').className=r==='client'?'bg-green-600 text-white p-3 rounded-xl font-bold text-xs':'bg-gray-100 p-3 rounded-xl font-bold text-xs';document.getElementById('bV').className=r==='vendeur'?'bg-green-600 text-white p-3 rounded-xl font-bold text-xs':'bg-gray-100 p-3 rounded-xl font-bold text-xs';document.getElementById('bL').className=r==='livreur'?'bg-green-600 text-white p-3 rounded-xl font-bold text-xs':'bg-gray-100 p-3 rounded-xl font-bold text-xs';document.getElementById('fC').classList.toggle('hidden',r!=='client');document.getElementById('fV').classList.toggle('hidden',r!=='vendeur');document.getElementById('fL').classList.toggle('hidden',r!=='livreur');}
function render(){document.getElementById('grid').innerHTML=getAll().map(x=>`<div class="bg-white rounded-xl shadow overflow-hidden"><img src="${x.img}" class="h-36 w-full object-cover"><div class="p-2"><p class="font-bold text-xs">${x.name}</p><p class="text-green-600 font-black text-xs">${x.price}F - ${x.vendeur}</p></div></div>`).join('');}
function my(){let m=JSON.parse(localStorage.getItem('tg')||'[]');document.getElementById('my').innerHTML=m.map(x=>`<div class="bg-white rounded shadow overflow-hidden"><img src="${x.img}" class="h-20 w-full object-cover"><p class="p-1 text-xs font-bold">${x.name}</p></div>`).join('');}
function creer(t){let n=t==='client'?document.getElementById('cNom').value:t==='vendeur'?document.getElementById('vNom').value:document.getElementById('lNom').value;localStorage.setItem('tu',JSON.stringify({role:t,nom:n}));alert('✅ '+t+' créé: '+n);go('home');}
function publier(){if(!photo)return alert('Choisis photo d’abord!');let n=document.getElementById('nom').value,p=document.getElementById('prix').value;if(!n||!p)return alert('Nom+prix');let all=JSON.parse(localStorage.getItem('tg')||'[]');all.unshift({name:n,price:p,vendeur:JSON.parse(localStorage.getItem('tu')||'{}').nom||'Moi',img:photo});localStorage.setItem('tg',JSON.stringify(all));render();my();alert('✅ Publié!');}
document.getElementById('file').addEventListener('change',e=>{let r=new FileReader();r.onload=ev=>{photo=ev.target.result;let im=document.getElementById('prev');im.src=photo;im.classList.remove('hidden');};r.readAsDataURL(e.target.files[0]);});
window.addEventListener('load',()=>{render();});
</script>
</body>
</html>
