<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Togo Go V7.1</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{background:#f6f7fb;font-family:sans-serif}</style>
</head>
<body class="pb-24">
<header class="bg-gradient-to-r from-green-600 to-yellow-500 text-white p-3 sticky top-0 z-50 shadow">
<div class="flex justify-between items-center max-w-7xl mx-auto">
<div class="flex items-center gap-2">
<button onclick="nav('home')" id="backBtn" class="hidden bg-black/30 w-9 h-9 rounded-full text-sm font-bold">⬅️</button>
<b class="text-[15px]">🛍️ Togo Go V7.1</b>
</div>
<div class="flex gap-1">
<button onclick="nav('home')" class="bg-white text-green-700 px-4 py-2 rounded-full text-[11px] font-black">Accueil</button>
<button onclick="nav('vendeur')" class="bg-black/20 px-3 py-2 rounded-full text-[11px] font-bold">🏪 Vendre</button>
<button onclick="nav('compte')" class="bg-black/20 px-3 py-2 rounded-full text-[11px]">Compte</button>
</div>
</div>
</header>

<div id="home" class="max-w-7xl mx-auto p-3">
<div class="bg-white rounded-2xl p-3 shadow flex gap-2 mt-2"><input id="search" oninput="renderHome()" placeholder="Rechercher: tomates, chambre, riz..." class="flex-1 outline-none text-sm"><i class="fa-solid fa-search text-gray-400 p-2"></i></div>
<div class="flex gap-2 mt-3 overflow-x-auto"><button onclick="setCat('all')" id="catAll" class="bg-green-600 text-white px-4 py-2 rounded-full text-[11px] font-bold">Tout</button><button onclick="setCat('boutique')" id="catBoutique" class="bg-white px-4 py-2 rounded-full text-[11px] font-bold">🏪 Boutiques</button><button onclick="setCat('hotel')" id="catHotel" class="bg-white px-4 py-2 rounded-full text-[11px] font-bold">🏨 Hôtels</button><button onclick="setCat('restaurant')" id="catResto" class="bg-white px-4 py-2 rounded-full text-[11px] font-bold">🍚 Restos</button><button onclick="setCat('ambulant')" id="catAmbulant" class="bg-white px-4 py-2 rounded-full text-[11px] font-bold">🚶 Ambulants</button></div>
<div class="mt-3 bg-green-600 text-white rounded-xl p-3 flex justify-between"><div><p class="font-black text-sm">Marché d'Agoè en direct</p><p id="countInfo" class="text-[11px]">0 produits</p></div><div class="bg-white text-green-600 px-3 py-1 rounded-full text-[10px] font-black">GRATUIT</div></div>
<div id="grid" class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-3"></div>
</div>

<div id="vendeur" class="hidden max-w-4xl mx-auto p-3">
<div class="bg-white rounded-2xl shadow p-5 mt-2">
<div class="flex justify-between items-center"><h2 class="font-black">🏪 Vendre - Gratuit</h2><button onclick="nav('home')" class="bg-gray-100 px-4 py-2 rounded-full text-xs font-bold">⬅️ Accueil</button></div>
<div id="boutiqueInfo" class="mt-3 bg-gray-50 rounded-xl p-3 text-xs">Pas de boutique - va dans Compte -> Vendeur</div>
<div class="mt-4 border-2 border-dashed border-green-300 rounded-xl p-3 bg-green-50"><p class="font-bold text-xs">📸 Photo boutique / immeuble</p><img id="coverPrev" class="hidden w-full h-48 object-cover rounded-xl mt-2"><input type="file" id="coverFile" accept="image/*" class="mt-2 w-full text-xs"></div>
<div class="mt-3 flex gap-2 bg-yellow-50 p-3 rounded-xl border"><input type="checkbox" id="isAmbulant" class="w-5 h-5"><label class="text-xs font-bold">🚶 Je suis ambulant</label></div>
<div class="mt-4 border-2 border-black rounded-2xl p-4"><h3 class="font-black text-sm">➕ Publier article / chambre / plat</h3><div class="mt-3"><p class="text-[11px] font-bold">📸 Photos (1 à 4) *</p><div id="prodPrevs" class="grid grid-cols-2 gap-2 mt-2"></div><input type="file" id="prodFiles" accept="image/*" multiple class="mt-2 w-full text-xs border p-2 rounded-xl"></div><input id="pName" placeholder="Nom: Tomates / Chambre / Riz" class="mt-3 w-full border-2 rounded-xl p-3 text-sm"><div class="grid grid-cols-2 gap-2 mt-2"><input id="pDetail" type="number" placeholder="Prix Détail F" class="border-2 rounded-xl p-3 text-sm font-bold"><input id="pGros" type="number" placeholder="Prix Gros (option)" class="border rounded-xl p-3 text-sm bg-gray-50"></div><textarea id="pDesc" placeholder="Description libre..." class="mt-2 w-full border rounded-xl p-3 text-sm h-20"></textarea><button onclick="publierArticle()" class="mt-3 w-full bg-black text-white p-4 rounded-xl font-black">✅ Publier sur Accueil</button></div>
<div class="mt-5"><h3 class="font-bold text-sm">📦 Mes publications</h3><div id="myGrid" class="grid grid-cols-2 gap-2 mt-2"></div></div>
</div>
</div>

<div id="compte" class="hidden max-w-2xl mx-auto p-3">
<div class="bg-white rounded-2xl shadow p-5 mt-2">
<div class="flex justify-between items-center"><h2 class="font-black text-lg">Compte</h2><button onclick="nav('home')" class="bg-gray-100 px-4 py-2 rounded-full text-xs font-bold">⬅️ Accueil</button></div>
<div class="grid grid-cols-3 gap-2 mt-4"><button id="bC" onclick="setRole('client')" class="bg-green-600 text-white p-3 rounded-xl font-bold text-xs">Client</button><button id="bV" onclick="setRole('vendeur')" class="bg-gray-100 p-3 rounded-xl font-bold text-xs">Vendeur</button><button id="bL" onclick="setRole('livreur')" class="bg-gray-100 p-3 rounded-xl font-bold text-xs">Livreur</button></div>
<div id="fClient" class="mt-5 space-y-3"><input id="cNom" placeholder="Nom" class="w-full border rounded-xl p-3 text-sm"><input id="cTel" placeholder="Tel WhatsApp" class="w-full border rounded-xl p-3 text-sm"><input id="cAdr" placeholder="Adresse Agoè..." class="w-full border rounded-xl p-3 text-sm"><button onclick="createUser('client')" class="w-full bg-green-600 text-white p-3 rounded-xl font-bold">Créer Client</button></div>
<div id="fVendeur" class="hidden mt-5 space-y-3"><div class="bg-green-100 text-center text-xs p-2 rounded-xl font-bold">🎉 GRATUIT illimité</div><input id="vNom" placeholder="Nom boutique / Hôtel" class="w-full border rounded-xl p-3 text-sm"><input id="vTel" placeholder="Téléphone" class="w-full border rounded-xl p-3 text-sm"><select id="vType" class="w-full border rounded-xl p-3 text-sm bg-white font-bold"><option value="boutique">🏪 Boutique</option><option value="hotel">🏨 Hôtel</option><option value="restaurant">🍚 Restaurant</option><option value="bar">🍺 Bar</option><option value="ambulant">🚶 Ambulant</option><option value="autre">✍️ Autre</option></select><textarea id="vTypeLibre" placeholder="Décris librement ton activité..." class="w-full border-2 border-green-200 rounded-xl p-3 text-sm h-20 bg-yellow-50"></textarea><button onclick="createUser('vendeur')" class="w-full bg-orange-600 text-white p-3 rounded-xl font-bold">✅ Créer boutique</button></div>
<div id="fLivreur" class="hidden mt-5 space-y-3"><input id="lNom" placeholder="Nom" class="w-full border rounded-xl p-3 text-sm"><input id="lTel" placeholder="Tel" class="w-full border rounded-xl p-3 text-sm"><input id="lPass" type="password" placeholder="Mot de passe" class="w-full border rounded-xl p-3 text-sm"><input id="lPlaque" placeholder="Plaque" class="w-full border rounded-xl p-3 text-sm"><button onclick="createUser('livreur')" class="w-full bg-red-600 text-white p-3 rounded-xl font-bold">Créer Livreur</button></div>
</div>
</div>

<div id="buyModal" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-sm"><div class="flex justify-between"><h3 id="mName" class="font-black"></h3><button onclick="document.getElementById('buyModal').classList.add('hidden')" class="bg-gray-100 w-8 h-8 rounded-full">✕</button></div><img id="mImg" class="w-full h-48 object-cover rounded-xl mt-3"><p id="mVendeur" class="text-xs text-gray-500 mt-2"></p><p id="mPrice" class="text-green-600 font-black mt-1"></p><p id="mDesc" class="text-xs text-gray-600 mt-2"></p><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="alert('✅ J\'y vais moi-même')" class="bg-green-600 text-white p-3 rounded-xl text-xs font-bold">🚶 J'y vais</button><button onclick="alert('🛵 Livreur demandé')" class="bg-black text-white p-3 rounded-xl text-xs font-bold">🛵 Livreur</button></div><button onclick="document.getElementById('buyModal').classList.add('hidden')" class="mt-3 w-full bg-gray-100 p-2 rounded-xl text-xs font-bold">⬅️ Retour Accueil</button></div></div>

<script>
let cat='all', coverPhoto=null, prodPhotos=[], userRole='client';
const BASE=[{name:"Tomates 1kg",detail:800,gros:7000,vendeur:"Mama Afi",type:"boutique",ambulant:false,img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400",desc:"Frais"},{name:"Chambre clim",detail:15000,gros:0,vendeur:"Hôtel 2F",type:"hotel",ambulant:false,img:"https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=400",desc:"Chambre clim wifi"},{name:"Bananes ambulant",detail:500,gros:4000,vendeur:"Koffi",type:"ambulant",ambulant:true,img:"https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400",desc:"Je me promène"}];
function getProds(){return [...JSON.parse(localStorage.getItem('tg_v7')||'[]'),...BASE];}
function nav(p){document.getElementById('home').classList.toggle('hidden',p!=='home');document.getElementById('vendeur').classList.toggle('hidden',p!=='vendeur');document.getElementById('compte').classList.toggle('hidden',p!=='compte');document.getElementById('backBtn').classList.toggle('hidden',p==='home');if(p==='vendeur')renderMy();if(p==='home')renderHome();}
function setRole(r){userRole=r;document.getElementById('bC').className=r==='client'?'bg-green-600 text-white p-3 rounded-xl font-bold text-xs':'bg-gray-100 p-3 rounded-xl font-bold text-xs';document.getElementById('bV').className=r==='vendeur'?'bg-green-600 text-white p-3 rounded-xl font-bold text-xs':'bg-gray-100 p-3 rounded-xl font-bold text-xs';document.getElementById('bL').className=r==='livreur'?'bg-green-600 text-white p-3 rounded-xl font-bold text-xs':'bg-gray-100 p-3 rounded-xl font-bold text-xs';document.getElementById('fClient').classList.toggle('hidden',r!=='client');document.getElementById('fVendeur').classList.toggle('hidden',r!=='vendeur');document.getElementById('fLivreur').classList.toggle('hidden',r!=='livreur');}
function setCat(c){cat=c;['all','boutique','hotel','ambulant'].forEach(k=>{let el=document.getElementById('cat'+k.charAt(0).toUpperCase()+k.slice(1)); if(el) el.className=k===c?'bg-green-600 text-white px-4 py-2 rounded-full text-[11px] font-bold':'bg-white px-4 py-2 rounded-full text-[11px] font-bold';}); let r=document.getElementById('catResto'); if(r) r.className=c==='restaurant'?'bg-green-600 text-white px-4 py-2 rounded-full text-[11px] font-bold':'bg-white px-4 py-2 rounded-full text-[11px] font-bold'; renderHome();}
function renderHome(){let q=document.getElementById('search').value.toLowerCase();let list=getProds().filter(p=>{let okCat=cat==='all'||p.type===cat||(cat==='ambulant'&&p.ambulant); let okS=!q||p.name.toLowerCase().includes(q)||p.vendeur.toLowerCase().includes(q); return okCat&&okS;}); document.getElementById('countInfo').innerText=list.length+' produits'; document.getElementById('grid').innerHTML=list.map(p=>`<div onclick="openBuy('${p.name}')" class="bg-white rounded-2xl shadow overflow-hidden border cursor-pointer"><div class="relative"><img src="${p.img}" class="h-36 w-full object-cover">${p.ambulant?'<span class="absolute top-2 left-2 bg-yellow-400 text-[9px] px-2 py-1 rounded-full font-black">🚶 AMBULANT</span>':''}</div><div class="p-3"><p class="font-black text-[12px]">${p.name}</p><p class="text-[10px] text-gray-500">${p.vendeur}</p><p class="text-green-600 font-black text-xs">${p.detail}F ${p.gros?'/ '+p.gros+'F gros':''}</p></div></div>`).join('');}
function openBuy(name){let p=getProds().find(x=>x.name===name); if(!p) return; document.getElementById('mImg').src=p.img; document.getElementById('mName').innerText=p.name; document.getElementById('mVendeur').innerText=p.vendeur; document.getElementById('mPrice').innerText=p.detail+'F'+(p.gros?' / '+p.gros+'F gros':''); document.getElementById('mDesc').innerText=p.desc; document.getElementById('buyModal').classList.remove('hidden');}
function renderMy(){let m=JSON.parse(localStorage.getItem('tg_v7')||'[]'); document.getElementById('myGrid').innerHTML=m.map(x=>`<div class="bg-white rounded-xl shadow overflow-hidden border"><img src="${x.img}" class="h-20 w-full object-cover"><p class="p-2 text-[11px] font-bold">${x.name}</p></div>`).join('')||'<p class="text-xs text-gray-400">Aucun</p>';}
function createUser(t){let nom=t==='client'?document.getElementById('cNom').value:t==='vendeur'?document.getElementById('vNom').value:document.getElementById('lNom').value; if(!nom) return alert('Nom'); let u={role:t,nom:nom,type:document.getElementById('vType').value, libre:document.getElementById('vTypeLibre').value}; localStorage.setItem('tg_user_v7',JSON.stringify(u)); document.getElementById('boutiqueInfo').innerHTML=`✅ ${nom} - ${u.type}<br><span class="text-green-600 font-bold">Tu peux publier maintenant!</span>`; alert('✅ '+t+' créé'); nav(t==='vendeur'?'vendeur':'home');}
document.getElementById('coverFile').addEventListener('change',e=>{let r=new FileReader(); r.onload=ev=>{coverPhoto=ev.target.result; let im=document.getElementById('coverPrev'); im.src=coverPhoto; im.classList.remove('hidden');}; r.readAsDataURL(e.target.files[0]);});
document.getElementById('prodFiles').addEventListener('change',e=>{prodPhotos=[]; let c=document.getElementById('prodPrevs'); c.innerHTML=''; for(let i=0;i<Math.min(e.target.files.length,4);i++){let r=new FileReader(); r.onload=ev=>{prodPhotos.push(ev.target.result); let img=document.createElement('img'); img.src=ev.target.result; img.className='h-20 w-full object-cover rounded-xl border'; c.appendChild(img);}; r.readAsDataURL(e.target.files[i]);}});
function publierArticle(){let name=document.getElementById('pName').value, detail=parseInt(document.getElementById('pDetail').value), gros=parseInt(document.getElementById('pGros').value)||0; if(prodPhotos.length===0) return alert('📸 Photo!'); if(!name||!detail) return alert('Nom+Prix'); let u=JSON.parse(localStorage.getItem('tg_user_v7')||'{}'); let all=JSON.parse(localStorage.getItem('tg_v7')||'[]'); all.unshift({name:name,detail:detail,gros:gros,vendeur:u.nom||'Moi',type:u.type||'boutique',ambulant:document.getElementById('isAmbulant').checked,img:prodPhotos[0],desc:document.getElementById('pDesc').value,cover:coverPhoto}); localStorage.setItem('tg_v7',JSON.stringify(all)); renderHome(); renderMy(); alert('✅ Publié!');}
window.addEventListener('load',()=>{setRole('client'); setCat('all'); renderHome();});
</script>
</body>
</html>
